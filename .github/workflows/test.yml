name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m py_compile scripts/scan_public_safety.py tests/merge_benchmark.py tests/git_batch_proof.py
      - name: Benchmark clean batch
        run: python tests/merge_benchmark.py --prs 8 --ci-seconds 120 --target-seconds 600 --batch-size 8 --parallel-split
      - name: Git proof clean batch
        run: python tests/git_batch_proof.py --prs 8 --ci-seconds 120 --parallel-split
      - name: Git proof bad branch isolation
        run: python tests/git_batch_proof.py --prs 8 --bad-prs 5 --ci-seconds 120 --parallel-split
      - name: Public safety scan
        run: python scripts/scan_public_safety.py .
